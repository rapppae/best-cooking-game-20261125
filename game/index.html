<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soto Rush — Warung Soto Express</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b1a0c;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #wrap {
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    cursor: pointer;
    image-rendering: auto;
  }
  noscript { color: #fff8e7; text-align: center; display: block; padding: 2em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="Soto Rush — game masak warung soto"></canvas>
</div>
<noscript>Soto Rush butuh JavaScript untuk jalan.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
